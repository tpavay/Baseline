name: Deploy Staging

# Staging deploys on every push to develop (plus manual dispatch). Unlike
# Ascend, Baseline's staging trigger cannot collide with production: no other
# workflow touches develop, so push-triggering is safe here.
on:
  push:
    branches: [develop]
    paths:
      - "Baseline/**"
      - "project.yml"
      - "fastlane/**"
      - "Gemfile*"
      - "scripts/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - ".firebaserc"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (Staging)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Configure SSH for match repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Trust GitHub host key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"

      - name: Decode Firebase plist files
        env:
          GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          GOOGLE_SERVICE_INFO_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_STAGING_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          decode_base64_required() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"

            if [ -z "$encoded" ]; then
              echo "::error::Required secret ${secret_name} is missing or empty."
              exit 1
            fi

            if ! (printf "%s" "$encoded" | base64 --decode > "$output_path" 2>/dev/null || printf "%s" "$encoded" | base64 -D > "$output_path" 2>/dev/null); then
              echo "::error::Failed to decode secret ${secret_name} as base64."
              exit 1
            fi

            if [ ! -s "$output_path" ]; then
              echo "::error::Decoded file for ${secret_name} is empty."
              exit 1
            fi

            if ! plutil -lint "$output_path" >/dev/null; then
              echo "::error::Decoded file for ${secret_name} is not a valid plist."
              exit 1
            fi
          }

          mkdir -p Baseline/App/Firebase
          rm -f Baseline/App/Firebase/GoogleService-Info-Dev.plist
          rm -f Baseline/App/Firebase/GoogleService-Info-Staging.plist
          decode_base64_required "GOOGLE_SERVICE_INFO_DEV_BASE64" "$GOOGLE_SERVICE_INFO_DEV_BASE64" "Baseline/App/Firebase/GoogleService-Info-Dev.plist"
          decode_base64_required "GOOGLE_SERVICE_INFO_STAGING_BASE64" "$GOOGLE_SERVICE_INFO_STAGING_BASE64" "Baseline/App/Firebase/GoogleService-Info-Staging.plist"

      # Baseline's .xcodeproj is generated by XcodeGen and gitignored, so CI must
      # generate it before Fastlane can archive. (Ascend commits its .xcodeproj,
      # so this step has no Ascend counterpart.)
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate match secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$MATCH_GIT_URL" ]; then
            echo "::error::Required secret MATCH_GIT_URL is missing or empty."
            exit 1
          fi

          if [ -z "$MATCH_PASSWORD" ]; then
            echo "::error::Required secret MATCH_PASSWORD is missing or empty."
            exit 1
          fi

      - name: Build staging IPA via Fastlane
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BRANCH: main
          MATCH_READONLY: "true"
          IOS_SIGNING_IDENTITY: Apple Distribution
          IOS_PROVISIONING_PROFILE_SPECIFIER: match AppStore com.tylerpavay.Baseline.staging
          IOS_DEVELOPMENT_TEAM: QWGVB7TN4T
          IOS_STAGING_BUNDLE_ID: com.tylerpavay.Baseline.staging
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane build_staging

      - name: Upload staging IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baseline-Staging-IPA
          path: fastlane/build/Baseline-Staging.ipa
          retention-days: 14

  # Runs in parallel with the IPA build: the Firebase deploy has no dependency
  # on the iOS binary, and staging tolerates backend deploying even when the
  # app build fails.
  deploy-firebase:
    name: Deploy Firebase (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies for deploy
        run: npm --prefix functions ci

      - name: Deploy Functions, Rules, Indexes, and Storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15.22.1 deploy --project baseline-app-staging --only functions,firestore:rules,firestore:indexes,storage --non-interactive --force --token "$FIREBASE_TOKEN"

  upload-testflight:
    name: Upload to TestFlight (Staging)
    needs:
      - build-ios
      - deploy-firebase
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Download staging IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Baseline-Staging-IPA
          path: build

      - name: Upload artifact to TestFlight
        env:
          IPA_PATH: build/Baseline-Staging.ipa
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane upload_testflight
