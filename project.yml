name: Baseline
options:
  bundleIdPrefix: com.tylerpavay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.15.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your team in Xcode (Signing & Capabilities) — required for Sign in with Apple on device
targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      - path: Baseline
        # Per-environment Firebase plists live here but are copied into the bundle
        # as GoogleService-Info.plist by the build script — never bundled directly.
        excludes:
          - "App/Firebase/*.plist"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Baseline/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHealthShareUsageDescription: "Baseline reads your workouts, sleep, and heart data to understand your recovery and training context."
        NSBluetoothAlwaysUsageDescription: "Baseline connects to your heart-rate strap to take your morning HRV reading."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              # Google Sign-In redirect schemes (REVERSED_CLIENT_ID) for both envs.
              - "com.googleusercontent.apps.121306436388-ep4vqd24ivlcjmd58m37bpsvrkp39c5g"   # baseline-app-dev
              - "com.googleusercontent.apps.1963302344-09rsgnfjm77n0468nstu863kl01rjefk"     # baseline-app-prod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.Baseline
        PRODUCT_NAME: Baseline
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Baseline/Baseline.entitlements
    postCompileScripts:
      - name: "Select Firebase plist (dev/prod)"
        script: '"${SRCROOT}/scripts/select-firebase-plist.sh"'
        basedOnDependencyAnalysis: false
  BaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaselineTests
    dependencies:
      - target: Baseline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.BaselineTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Baseline:
    build:
      targets:
        Baseline: all
        BaselineTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BaselineTests
