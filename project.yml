name: Baseline
# Three build configurations. Declaring `configs:` overrides XcodeGen's default
# Debug/Release pair, so all three must be listed. Staging is a release-type
# build (optimized, like a TestFlight build) that targets baseline-app-staging.
configs:
  Debug: debug
  Staging: release
  Release: release
options:
  bundleIdPrefix: com.tylerpavay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.15.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: QWGVB7TN4T
targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      - path: Baseline
        # Per-environment Firebase plists live here but are copied into the bundle
        # as GoogleService-Info.plist by the build script — never bundled directly.
        excludes:
          - "App/Firebase/*.plist"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Baseline/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHealthShareUsageDescription: "Baseline reads your sleep, heart rate, workouts, daily activity, and your age and biological sex from Apple Health so it can judge your recovery and set your heart-rate zones before it recommends training."
        # Baseline is read-only against Health (`HealthService` asks with `toShare: []`), but the
        # `com.apple.developer.healthkit` entitlement cannot be scoped to reads, so App Store
        # validation rejects the binary without an update purpose string. Kept honest: the string
        # is never shown while nothing is written. Revise it if Baseline ever does write.
        NSHealthUpdateUsageDescription: "Baseline does not save anything to Apple Health today; it only reads. It would ask for this only if you later choose to write a workout you completed in Baseline back to Health, and nothing else would be saved."
        NSBluetoothAlwaysUsageDescription: "Baseline connects to your heart-rate strap to take your morning HRV reading."
        NSCameraUsageDescription: "Baseline uses the camera and flash to read your pulse from your fingertip for your morning HRV reading."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              # Google Sign-In redirect schemes (REVERSED_CLIENT_ID) per env.
              - "com.googleusercontent.apps.121306436388-ep4vqd24ivlcjmd58m37bpsvrkp39c5g"   # baseline-app-dev
              - "com.googleusercontent.apps.1963302344-09rsgnfjm77n0468nstu863kl01rjefk"     # baseline-app-prod
              - "com.googleusercontent.apps.773651861110-bf5bmac3gufk8s63gt9lldn47um0ui4f"    # baseline-app-staging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.Baseline
        PRODUCT_NAME: Baseline
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # Distribution entitlements: App Attest environment `production`. Staging and Release
        # both inherit this and both must keep `production` - see the Debug override below.
        CODE_SIGN_ENTITLEMENTS: Baseline/Baseline.entitlements
      configs:
        # Locally-built development builds must attest against the App Attest *sandbox*.
        # Apple's rule (Preparing to Use the App Attest Service): an app that omits the
        # `com.apple.developer.devicecheck.appattest-environment` entitlement uses the sandbox
        # during development, and setting it to `production` opts a development build into the
        # real servers - which permanently pollutes that device's unresettable risk metrics.
        # The single shared entitlements file did exactly that, so Debug gets its own file.
        #
        # Staging is deliberately NOT `development`. Apple: "After distributing your app through
        # TestFlight, the App Store, or the Apple Developer Enterprise Program, your app ignores
        # the entitlement you set and uses the production environment." Staging ships through
        # TestFlight (`build_staging` + `upload_testflight`), so `development` there would be a
        # no-op that misrepresents what the build actually does. If staging ever needs genuine
        # sandbox attestation it has to stop being a TestFlight build.
        #
        # Keep the two files' non-environment keys identical; `EntitlementsConfigurationTests`
        # fails the build's test run if they drift or if either environment value changes.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Baseline/Baseline-Debug.entitlements
        # Signing settings for the distribution configs must live here, not in the
        # Xcode project. Baseline's .xcodeproj is gitignored and regenerated by
        # `xcodegen generate` on every CI run, so anything set in the project file
        # (by hand in Xcode, or by Fastlane) is discarded on the next generate.
        # Fastlane's `update_code_signing_settings` sets CODE_SIGN_STYLE and
        # CODE_SIGN_IDENTITY at build time but never PROVISIONING_PROFILE_SPECIFIER,
        # so without these keys the archive runs with manual signing and no profile
        # selected. Xcode then reports that misleadingly as "requires a provisioning
        # profile with the App Attest, HealthKit, and Sign In with Apple features".
        # Do not remove these as redundant. CI overwriting CODE_SIGN_IDENTITY with
        # the full certificate common name is expected; the short name here is the
        # sane default for local archives.
        #
        # Staging installs alongside a future prod build via a suffixed bundle id,
        # and gets its own App Store Connect record + match provisioning profile.
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.Baseline.staging
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.tylerpavay.Baseline.staging
        # The `Baseline` scheme archives with Release, so the production lane needs
        # the same settings the moment it is added.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.tylerpavay.Baseline
    postCompileScripts:
      - name: "Select Firebase plist (dev/staging/prod)"
        script: '"${SRCROOT}/scripts/select-firebase-plist.sh"'
        basedOnDependencyAnalysis: false
  BaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaselineTests
      - path: fixtures/workout-import/canonical-assembled-document.json
        buildPhase: resources
      - path: fixtures/workout-import/realistic-five-page-ocr.json
        buildPhase: resources
      - path: fixtures/workout-import/realistic-five-page-request.json
        buildPhase: resources
      - path: fixtures/workout-import/realistic-five-page-response.json
        buildPhase: resources
    dependencies:
      - target: Baseline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.BaselineTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Baseline:
    build:
      targets:
        Baseline: all
        BaselineTests: [test]
    # Pin run/archive configs explicitly so the new Staging config can never
    # become this scheme's archive config by accident.
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BaselineTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Archives the staging IPA. Fastlane's build_staging lane drives this scheme
  # with configuration Staging (see fastlane/Fastfile).
  Baseline-Staging:
    build:
      targets:
        Baseline: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
