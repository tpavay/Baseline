name: Baseline
options:
  bundleIdPrefix: com.tylerpavay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your team in Xcode (Signing & Capabilities)
targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      - path: Baseline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.Baseline
        PRODUCT_NAME: Baseline
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # Usage strings (entitlements added when HealthKit/BLE are wired up)
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Baseline reads your workouts, sleep, and heart data to understand your recovery and training context."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Baseline connects to your heart-rate strap to take your morning HRV reading."
  BaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaselineTests
    dependencies:
      - target: Baseline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.BaselineTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Baseline:
    build:
      targets:
        Baseline: all
        BaselineTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BaselineTests
