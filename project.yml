name: Baseline
# Three build configurations. Declaring `configs:` overrides XcodeGen's default
# Debug/Release pair, so all three must be listed. Staging is a release-type
# build (optimized, like a TestFlight build) that targets baseline-app-staging.
configs:
  Debug: debug
  Staging: release
  Release: release
options:
  bundleIdPrefix: com.tylerpavay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.15.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: QWGVB7TN4T
targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      - path: Baseline
        # Per-environment Firebase plists live here but are copied into the bundle
        # as GoogleService-Info.plist by the build script — never bundled directly.
        excludes:
          - "App/Firebase/*.plist"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Baseline/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHealthShareUsageDescription: "Baseline reads your workouts, sleep, and heart data to understand your recovery and training context."
        NSBluetoothAlwaysUsageDescription: "Baseline connects to your heart-rate strap to take your morning HRV reading."
        NSCameraUsageDescription: "Baseline uses the camera and flash to read your pulse from your fingertip for your morning HRV reading."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              # Google Sign-In redirect schemes (REVERSED_CLIENT_ID) per env.
              - "com.googleusercontent.apps.121306436388-ep4vqd24ivlcjmd58m37bpsvrkp39c5g"   # baseline-app-dev
              - "com.googleusercontent.apps.1963302344-09rsgnfjm77n0468nstu863kl01rjefk"     # baseline-app-prod
              # TODO(captain): replace with the REVERSED_CLIENT_ID from the
              # baseline-app-staging GoogleService-Info-Staging.plist (created when
              # the staging Firebase iOS app is registered). Until then the Staging
              # build's select-firebase-plist.sh URL-scheme guard will fail by design.
              - "com.googleusercontent.apps.REPLACE_WITH_STAGING_REVERSED_CLIENT_ID"          # baseline-app-staging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.Baseline
        PRODUCT_NAME: Baseline
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Baseline/Baseline.entitlements
      configs:
        # Staging installs alongside a future prod build via a suffixed bundle id,
        # and gets its own App Store Connect record + match provisioning profile.
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.Baseline.staging
    postCompileScripts:
      - name: "Select Firebase plist (dev/staging/prod)"
        script: '"${SRCROOT}/scripts/select-firebase-plist.sh"'
        basedOnDependencyAnalysis: false
  BaselineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaselineTests
      - path: fixtures/workout-import/canonical-assembled-document.json
        buildPhase: resources
      - path: fixtures/workout-import/realistic-five-page-ocr.json
        buildPhase: resources
      - path: fixtures/workout-import/realistic-five-page-request.json
        buildPhase: resources
      - path: fixtures/workout-import/realistic-five-page-response.json
        buildPhase: resources
    dependencies:
      - target: Baseline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpavay.BaselineTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Baseline:
    build:
      targets:
        Baseline: all
        BaselineTests: [test]
    # Pin run/archive configs explicitly so the new Staging config can never
    # become this scheme's archive config by accident.
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BaselineTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Archives the staging IPA. Fastlane's build_staging lane drives this scheme
  # with configuration Staging (see fastlane/Fastfile).
  Baseline-Staging:
    build:
      targets:
        Baseline: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
